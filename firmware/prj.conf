# === eBike firmware ===

# NCS defaults for cellular samples: deferred logging, assertions, reset on
# fatal error.
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_EBIKE_LOG_LEVEL_INF=y

# --- Serial console ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- TF-M (non-secure build variant) ---
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# --- Networking: sockets are offloaded to the modem ---
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# --- Modem library ---
CONFIG_NRF_MODEM_LIB=y
CONFIG_AT_MONITOR=y

# --- LTE link control ---
CONFIG_LTE_LINK_CONTROL=y
# LTE-M plus GNSS: mobility and low latency, with GNSS sharing the RF path.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
# PSM is not requested: it depends on CONFIG_LTE_LC_PSM_MODULE and is rarely
# granted while roaming anyway. GNSS priority mode handles the coexistence
# instead (see location.c).
# Connection evaluation: exposes RSRP/RSRQ/EARFCN.
CONFIG_LTE_LC_CONN_EVAL_MODULE=y
# PDN module: needed to force an APN through CONFIG_EBIKE_APN.
CONFIG_LTE_LC_PDN_MODULE=y
# Modem events (%MDMEV): search progress, reset loop, overheating.
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y

# Float formatting in logs (RSRQ in dB).
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Development shell on the NS console, used by flash.sh ---
# `at AT+CFUN=0` before every flash keeps the reset out of the modem RESET LOOP
# counter and saves the network cache to NVM.
CONFIG_SHELL=y
CONFIG_AT_SHELL=y

# --- IMU: LSM6DS0 on the X-NUCLEO-IKS01A1 shield (arduino_i2c) ---
# The driver enables itself from the devicetree node and pulls in CONFIG_I2C.
CONFIG_SENSOR=y
# Only the accelerometer is used, so the gyroscope axes stay unconfigured and
# the sensor draws less current.
CONFIG_LSM6DS0_GYRO_ENABLE_X_AXIS=n
CONFIG_LSM6DS0_GYRO_ENABLE_Y_AXIS=n
CONFIG_LSM6DS0_GYRO_ENABLE_Z_AXIS=n

# --- Wheel speed sensor (GPIO interrupt) ---
CONFIG_GPIO=y

# --- AWS IoT Core (MQTT/TLS) ---
# The broker endpoint and the client id are account specific: set them in
# firmware/local.conf (see local.conf.example).
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_CLIENT_ID_STATIC="ebike-001"
# --- Device Shadow: remote arming and configuration ---
# On every connection the shadow document is requested automatically, which
# recovers a desired state pushed while the device was offline.
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=y
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y
# JSON parser for the shadow documents.
CONFIG_CJSON_LIB=y

# MQTT transport of the aws_iot library. Mutual TLS uses the modem
# credentials (sec_tag 601, written at boot by the provisioning below).
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=601
CONFIG_MQTT_HELPER_STACK_SIZE=4096
# Maximum keepalive accepted by AWS IoT Core.
CONFIG_MQTT_KEEPALIVE=1200
CONFIG_MQTT_CLEAN_SESSION=y

# Provision the AWS credentials into the modem at boot (development only).
CONFIG_MODEM_KEY_MGMT=y
CONFIG_EBIKE_PROVISION_CERTS=y

# --- A-GNSS assistance from nRF Cloud (CoAP) ---
# The modem asks for assistance (ephemerides, almanac, time, position); it is
# fetched from nRF Cloud over CoAP as a one-shot request, independent of the
# AWS link. The board must be onboarded on nRF Cloud with credentials in the
# nRF Cloud sec_tag.
CONFIG_EBIKE_AGNSS=y
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_AGNSS=y
# Approximate position from the serving cell, which speeds up the TTFF.
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
# JWT self-signed by the modem key for nRF Cloud authentication.
CONFIG_MODEM_JWT=y
CONFIG_DATE_TIME=y
# CoAP settings required by nRF Cloud: the Zephyr defaults (256-byte buffers)
# are too small for the ~700-byte auth JWT and coap_client_req returns -EINVAL.
# KEEPOPEN preserves the DTLS session (CID) on nRF91x1.
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=64
CONFIG_NRF_CLOUD_COAP_KEEPOPEN=y

# --- Persistent configuration: NVS on the `storage` partition ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
# Allow flash writes despite the MPU, required for NVS on internal flash.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- Diagnostics: last reset cause (RESETREAS through hwinfo) ---
CONFIG_HWINFO=y

# --- Diagnostics: fatal error captured and reported on the next boot ---
# Replaces the reset-on-fatal of NCS_SAMPLES_DEFAULTS with our own handler,
# which stores reason/PC/thread in retained RAM before rebooting. THREAD_NAME
# names the guilty thread in the capture.
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
CONFIG_REBOOT=y

# --- Watchdog: catch SILENT hangs ---
# The fatal handler only sees FATAL errors. A thread stuck on a socket or a
# mutex produces no fault: the bike would go mute with nothing to report it.
# The task watchdog gives one channel per critical loop on top of the single
# hardware WDT (wdt0, mapped NON-SECURE on nRF9161, so the NS app can use it).
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# TASK_WDT_MIN_TIMEOUT bounds the period of the background channel that feeds
# the hardware WDT. The 100 ms default would wake the core ten times a second,
# which is unacceptable on battery. 10 s is the maximum allowed and stays well
# below the shortest channel timeout (EBIKE_WDT_TIMEOUT_S = 30 s).
CONFIG_TASK_WDT_MIN_TIMEOUT=10000

# --- Stacks and heap ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- Event bus and state machine ---
CONFIG_ZBUS=y
CONFIG_SMF=y
CONFIG_AT_MONITOR_HEAP_SIZE=512
# The cloud path shares the system workqueue with GNSS PVT handling, the IMU
# poll and the speed ticker. The 1152-byte default overflows on the network
# reconnection path, which triggers a stack guard reboot and, with it, a cold
# GNSS restart. Do not go below 4096.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
