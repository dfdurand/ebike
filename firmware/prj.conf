# === eBike firmware ===

# NCS defaults for cellular samples: deferred logging, assertions, reset on
# fatal error.
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_EBIKE_LOG_LEVEL_INF=y

# --- Serial console ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- TF-M (non-secure build variant) ---
CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

# --- Networking: sockets are offloaded to the modem ---
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y

# --- Modem library ---
CONFIG_NRF_MODEM_LIB=y
CONFIG_AT_MONITOR=y

# --- LTE link control ---
CONFIG_LTE_LINK_CONTROL=y
# LTE-M plus GNSS: mobility and low latency, with GNSS sharing the RF path.
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y
# PSM is not requested: it depends on CONFIG_LTE_LC_PSM_MODULE and is rarely
# granted while roaming anyway. GNSS priority mode handles the coexistence
# instead (see location.c).
# Connection evaluation: exposes RSRP/RSRQ/EARFCN.
CONFIG_LTE_LC_CONN_EVAL_MODULE=y
# PDN module: needed to force an APN through CONFIG_EBIKE_APN.
CONFIG_LTE_LC_PDN_MODULE=y
# Modem events (%MDMEV): search progress, reset loop, overheating.
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y

# Float formatting in logs (RSRQ in dB).
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Development shell on the NS console, used by flash.sh ---
# `at AT+CFUN=0` before every flash keeps the reset out of the modem RESET LOOP
# counter and saves the network cache to NVM.
CONFIG_SHELL=y
CONFIG_AT_SHELL=y

# --- IMU: LSM6DS0 on the X-NUCLEO-IKS01A1 shield (arduino_i2c) ---
# The driver enables itself from the devicetree node and pulls in CONFIG_I2C.
CONFIG_SENSOR=y
# Only the accelerometer is used, so the gyroscope axes stay unconfigured and
# the sensor draws less current.
CONFIG_LSM6DS0_GYRO_ENABLE_X_AXIS=n
CONFIG_LSM6DS0_GYRO_ENABLE_Y_AXIS=n
CONFIG_LSM6DS0_GYRO_ENABLE_Z_AXIS=n

# --- Wheel speed sensor (GPIO interrupt) ---
CONFIG_GPIO=y

# --- A-GNSS assistance from nRF Cloud (CoAP) ---
# The modem asks for assistance (ephemerides, almanac, time, position); it is
# fetched from nRF Cloud over CoAP as a one-shot request, independent of the
# AWS link. The board must be onboarded on nRF Cloud with credentials in the
# nRF Cloud sec_tag.
CONFIG_EBIKE_AGNSS=y
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_AGNSS=y
# Approximate position from the serving cell, which speeds up the TTFF.
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
# JWT self-signed by the modem key for nRF Cloud authentication.
CONFIG_MODEM_JWT=y
CONFIG_DATE_TIME=y
# CoAP settings required by nRF Cloud: the Zephyr defaults (256-byte buffers)
# are too small for the ~700-byte auth JWT and coap_client_req returns -EINVAL.
# KEEPOPEN preserves the DTLS session (CID) on nRF91x1.
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=64
CONFIG_NRF_CLOUD_COAP_KEEPOPEN=y

# --- Persistent configuration: NVS on the `storage` partition ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
# Allow flash writes despite the MPU, required for NVS on internal flash.
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- Stacks and heap ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# --- Event bus ---
CONFIG_ZBUS=y
CONFIG_AT_MONITOR_HEAP_SIZE=512
